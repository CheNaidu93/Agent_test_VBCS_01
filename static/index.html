
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SR Assist | Oracle Fusion AI Assistant</title>

    <style>
        :root {
            --bg-main: #ffffff;
            --bg-surface: #f0f4f9;
            --bg-surface-hover: #e3e8ef;
            --text-primary: #1f1f1f;
            --text-secondary: #5f6368;
            --accent-blue: #0b57d0;
            --accent-blue-hover: #0842a0;
            --border-subtle: #e0e3e7;
            --user-bubble: #f0f4f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont,
                'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
        }

        /* Header */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: var(--bg-main);
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
            gap: 12px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            min-width: 0;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-sparkle {
            color: var(--accent-blue);
            font-size: 1.4rem;
        }

        .context-pill {
            background: var(--bg-surface);
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            max-width: 55vw;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-btn {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .history-btn:hover {
            background: var(--bg-surface);
        }

        /* Main Chat Area */

        .chat-scroll-area {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 24px 24px 40px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        .chat-column {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex: 1;
        }

        /* Welcome Screen */

        .welcome-screen {
            margin: auto 0;
            padding: 40px 0;
        }

        .welcome-greeting {
            font-size: 2.5rem;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 8px;
            background: linear-gradient(
                90deg, #0b57d0, #4285f4, #8ab4f8
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-sub {
            font-size: 1.3rem;
            color: #9aa0a6;
            font-weight: 400;
        }

        /* Message Rows */

        .message-row {
            display: flex;
            width: 100%;
            gap: 16px;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-row {
            justify-content: flex-end;
        }

        .user-msg {
            background: var(--user-bubble);
            color: var(--text-primary);
            padding: 12px 18px;
            border-radius: 20px;
            border-bottom-right-radius: 4px;
            max-width: 78%;
            font-size: 0.98rem;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .bot-row {
            justify-content: flex-start;
            align-items: flex-start;
        }

        .bot-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0b57d0, #4285f4);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .bot-msg {
            color: var(--text-primary);
            font-size: 0.98rem;
            line-height: 1.65;
            flex: 1;
            min-width: 0;
            padding-top: 4px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        /* Typing Indicator */

        .typing-dots {
            display: inline-flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: #9aa0a6;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        /* Input Area */

        .input-wrapper {
            padding: 12px 24px 20px;
            background: var(--bg-main);
            flex-shrink: 0;
        }

        .input-box {
            max-width: 850px;
            margin: 0 auto;
            background: var(--bg-surface);
            border-radius: 28px;
            padding: 8px 12px 8px 20px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            border: 1px solid transparent;
            transition: background 0.15s ease,
                        border-color 0.15s ease,
                        box-shadow 0.15s ease;
        }

        .input-box:focus-within {
            background: #ffffff;
            border-color: var(--border-subtle);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .chat-input {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            outline: none;
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-primary);
            resize: none;
            max-height: 160px;
            padding: 8px 0;
            font-family: inherit;
        }

        .chat-input::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s ease,
                        transform 0.1s ease;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--accent-blue-hover);
        }

        .send-btn:disabled {
            background: #d2d7de;
            cursor: not-allowed;
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        @media (max-width: 600px) {
            .top-bar {
                padding: 12px 16px;
            }

            .chat-scroll-area {
                padding: 16px 16px 24px;
            }

            .input-wrapper {
                padding: 8px 16px 16px;
            }

            .welcome-greeting {
                font-size: 1.9rem;
            }

            .welcome-sub {
                font-size: 1.1rem;
            }

            .user-msg {
                max-width: 88%;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->

    <header class="top-bar">

        <div class="brand-section">

            <div class="brand-title">
                <span class="brand-sparkle">✦</span>
                <span>SR Assist</span>
            </div>

            <!-- Context label -->

            <div class="context-pill" id="chatContextLabel">
                Oracle Fusion Assistant
            </div>

        </div>

        <button
            class="history-btn"
            id="historyButton"
            type="button">

            <span>↻</span>
            <span>Sync History</span>

        </button>

    </header>


    <!-- Main Chat Area -->

    <main class="chat-scroll-area" id="scrollArea">

        <div class="chat-column" id="chatContainer">

            <div class="welcome-screen" id="welcomeScreen">

                <h1
                    class="welcome-greeting"
                    id="welcomeGreeting">
                    Hello!
                </h1>

                <p class="welcome-sub">
                    How can I help you today?
                </p>

            </div>

        </div>

    </main>


    <!-- Input Area -->

    <footer class="input-wrapper">

        <div class="input-box">

            <textarea
                id="userInput"
                class="chat-input"
                rows="1"
                placeholder="Ask SR Assist..."
                autocomplete="off">
            </textarea>

            <button
                class="send-btn"
                id="sendButton"
                type="button"
                title="Send message"
                aria-label="Send message">

                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <line x1="22" y1="2" x2="11" y2="13"></line>

                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>

                </svg>

            </button>

        </div>

        <div class="footer-note">
            Oracle Fusion AI Assistant · Verify important record details
        </div>

    </footer>


    <script>

        // ==================================================
        // 1. READ FUSION PAGE PARAMETERS
        // ==================================================

        const chatUrlParams =
            new URLSearchParams(window.location.search);

        const userName =
            chatUrlParams.get("user_name") ||
            chatUrlParams.get("username") ||
            "Fusion User";

        const requestedPageType =
            (chatUrlParams.get("page_type") || "GENERAL").toUpperCase();

        const allowedPageTypes = [
            "GENERAL",
            "SERVICE_REQUEST",
            "CUSTOMER"
        ];

        const pageType = allowedPageTypes.includes(requestedPageType)
            ? requestedPageType
            : "GENERAL";

        const recordId =
            chatUrlParams.get("record_id") || null;

        const recordNumber =
            chatUrlParams.get("record_number") || null;

        const pageTitle =
            chatUrlParams.get("page_title") || "";

        // Keep the existing API context structure.

        const chatContext = {
            application: "Oracle Fusion",
            page_type: pageType,
            record_id: recordId
        };


        // ==================================================
        // 2. INITIALIZE WELCOME MESSAGE AND CONTEXT
        // ==================================================

        const welcomeGreeting =
            document.getElementById("welcomeGreeting");

        const contextLabel =
            document.getElementById("chatContextLabel");

        welcomeGreeting.textContent =
            `Hello, ${userName}`;

        const contextParts = [
            pageTitle || pageType,
            userName
        ];

        if (recordNumber || recordId) {
            contextParts.push(
                `Record: ${recordNumber || recordId}`
            );
        }

        contextLabel.textContent =
            contextParts.join(" • ");

        console.log("Chatbot initialized");
        console.log("User:", userName);
        console.log("Page Type:", pageType);
        console.log("Record ID:", recordId);
        console.log("Chat Context:", chatContext);


        // ==================================================
        // 3. CREATE SESSION ID
        // ==================================================

        const sessionStorageKey =
            `oracle_chat_session_${pageType}_${recordId || "general"}`;

        let userId =
            sessionStorage.getItem(sessionStorageKey);

        if (!userId) {

            userId = "session_" + (
                window.crypto && window.crypto.randomUUID
                    ? window.crypto.randomUUID()
                    : Date.now() + "_" +
                      Math.floor(Math.random() * 100000)
            );

            sessionStorage.setItem(
                sessionStorageKey,
                userId
            );

        }

        console.log("Chat Session ID:", userId);


        // ==================================================
        // 4. GET INPUT AND BUTTON ELEMENTS
        // ==================================================

        const inputElem =
            document.getElementById("userInput");

        const sendButton =
            document.getElementById("sendButton");

        const historyButton =
            document.getElementById("historyButton");


        // ==================================================
        // 5. SEND BUTTON CLICK EVENT
        // ==================================================

        sendButton.addEventListener("click", function () {

            console.log("Send button clicked");

            sendMessage();

        });


        // ==================================================
        // 6. HISTORY BUTTON CLICK EVENT
        // ==================================================

        historyButton.addEventListener("click", function () {

            console.log("History button clicked");

            loadHistory();

        });


        // ==================================================
        // 7. AUTO RESIZE TEXTAREA
        // ==================================================

        inputElem.addEventListener("input", function () {

            this.style.height = "auto";

            this.style.height =
                Math.min(this.scrollHeight, 160) + "px";

        });


        // ==================================================
        // 8. ENTER KEY TO SEND MESSAGE
        // ==================================================

        inputElem.addEventListener("keydown", function (event) {

            if (event.key === "Enter" && !event.shiftKey) {

                event.preventDefault();

                sendMessage();

            }

        });


        // ==================================================
        // 9. SEND MESSAGE TO CHATBOT API
        // ==================================================

        async function sendMessage() {

            console.log("sendMessage() started");

            const message = inputElem.value.trim();

            if (!message) {

                console.log("Message is empty");

                return;

            }

            if (sendButton.disabled) {

                console.log("Send button is disabled");

                return;

            }

            // Remove welcome screen after first message.

            const welcomeScreen =
                document.getElementById("welcomeScreen");

            if (welcomeScreen) {
                welcomeScreen.remove();
            }

            // Display user message.

            appendMessage(message, "user-msg");

            // Clear input.

            inputElem.value = "";

            inputElem.style.height = "auto";

            // Disable button while processing.

            sendButton.disabled = true;

            // Show typing indicator.

            const typingRow = showTypingIndicator();


            try {

                console.log("Calling chatbot API...");

                const response = await fetch("/api/v1/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        user_id: userId,

                        message: message,

                        context: chatContext

                    })

                });


                console.log(
                    "Chat API Status:",
                    response.status
                );


                if (!response.ok) {

                    const errorText = await response.text();

                    throw new Error(
                        `API Error ${response.status}: ${errorText}`
                    );

                }


                const data = await response.json();

                console.log(
                    "Chatbot Response:",
                    data
                );


                // Remove typing indicator.

                if (typingRow.isConnected) {
                    typingRow.remove();
                }


                // Display chatbot response.

                appendMessage(

                    data.response ||
                    "The chatbot returned an empty response.",

                    "bot-msg"

                );


            } catch (error) {

                console.error(
                    "Chatbot API Error:",
                    error
                );


                if (typingRow.isConnected) {
                    typingRow.remove();
                }


                appendMessage(

                    "Unable to communicate with the chatbot server. " +
                    "Please try again.",

                    "bot-msg"

                );


            } finally {

                // Re-enable Send button.

                sendButton.disabled = false;

                inputElem.focus();

            }

        }


        // ==================================================
        // 10. LOAD CHAT HISTORY
        // ==================================================

        async function loadHistory() {

            console.log("Loading conversation history...");

            try {

                const response = await fetch(

                    `/api/v1/history/${encodeURIComponent(userId)}`

                );


                if (!response.ok) {

                    throw new Error(
                        `History API Error: ${response.status}`
                    );

                }


                const data = await response.json();

                console.log(
                    "History Response:",
                    data
                );


                const container =
                    document.getElementById("chatContainer");


                // Clear existing messages.

                container.replaceChildren();


                if (
                    data.history &&
                    data.history.length > 0
                ) {

                    data.history.forEach(item => {

                        const className =
                            item.role === "user"
                                ? "user-msg"
                                : "bot-msg";

                        appendMessage(
                            item.text,
                            className
                        );

                    });

                } else {

                    appendMessage(

                        "No previous conversation history was found.",

                        "bot-msg"

                    );

                }


            } catch (error) {

                console.error(
                    "Failed to load history:",
                    error
                );


                appendMessage(

                    "Unable to load conversation history.",

                    "bot-msg"

                );

            }

        }


        // ==================================================
        // 11. APPEND MESSAGE TO CHAT WINDOW
        // ==================================================

        function appendMessage(text, className) {

            const container =
                document.getElementById("chatContainer");

            const scrollArea =
                document.getElementById("scrollArea");


            const rowDiv =
                document.createElement("div");


            rowDiv.className =
                className === "user-msg"
                    ? "message-row user-row"
                    : "message-row bot-row";


            // Add bot avatar.

            if (className === "bot-msg") {

                const avatar =
                    document.createElement("div");

                avatar.className = "bot-avatar";

                avatar.textContent = "✦";

                rowDiv.appendChild(avatar);

            }


            // Add message text safely.

            const msgDiv =
                document.createElement("div");

            msgDiv.className = className;

            msgDiv.textContent =
                String(text ?? "");


            rowDiv.appendChild(msgDiv);

            container.appendChild(rowDiv);


            // Scroll to latest message.

            scrollArea.scrollTop =
                scrollArea.scrollHeight;

        }


        // ==================================================
        // 12. SHOW TYPING INDICATOR
        // ==================================================

        function showTypingIndicator() {

            const container =
                document.getElementById("chatContainer");

            const scrollArea =
                document.getElementById("scrollArea");


            const rowDiv =
                document.createElement("div");

            rowDiv.className =
                "message-row bot-row";


            const avatar =
                document.createElement("div");

            avatar.className = "bot-avatar";

            avatar.textContent = "✦";


            const dots =
                document.createElement("div");

            dots.className = "typing-dots";


            // Create three animated dots.

            for (let i = 0; i < 3; i++) {

                const dot =
                    document.createElement("span");

                dots.appendChild(dot);

            }


            rowDiv.appendChild(avatar);

            rowDiv.appendChild(dots);

            container.appendChild(rowDiv);


            scrollArea.scrollTop =
                scrollArea.scrollHeight;


            return rowDiv;

        }


        // ==================================================
        // 13. INITIALIZATION COMPLETE
        // ==================================================

        console.log(
            "SR Assist initialized successfully."
        );

    </script>

</body>
</html>
