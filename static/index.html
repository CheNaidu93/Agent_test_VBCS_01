<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-card { width: 450px; height: 600px; background: #ffffff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #0078d4; color: white; padding: 16px; font-size: 1.1rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .chat-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .user-msg { background: #0078d4; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background: #e9ecef; color: #212529; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-footer { display: flex; padding: 12px; border-top: 1px solid #e0e0e0; background: #fafafa; }
        .chat-input { flex: 1; border: 1px solid #ccc; padding: 10px 14px; border-radius: 20px; outline: none; font-size: 0.95rem; }
        .chat-input:focus { border-color: #0078d4; }
        .send-btn { background: #0078d4; color: white; border: none; padding: 10px 18px; margin-left: 8px; border-radius: 20px; cursor: pointer; font-weight: 600; }
        .send-btn:hover { background: #005a9e; }
    </style>
</head>
<body>

<div class="chat-card">
    <div class="chat-header">
        <span>Chatbot Interface</span>
        <button onclick="loadHistory()" style="background:transparent; border:1px solid white; color:white; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:0.75rem;">Sync History (GET)</button>
    </div>
    <div class="chat-body" id="chatContainer">
        <div class="message bot-msg">Hello! How can I help you today?</div>
    </div>
    <div class="chat-footer">
        <input type="text" id="userInput" class="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // Unique user session ID
    const userId = "session_" + Math.floor(Math.random() * 100000);

    async function sendMessage() {
        const inputElem = document.getElementById("userInput");
        const message = inputElem.value.trim();
        if (!message) return;

        // Append user message immediately to UI
        appendMessage(message, "user-msg");
        inputElem.value = "";

        try {
            // REST POST Call to backend API
            const response = await fetch("/api/v1/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: userId, message: message })
            });

            if (!response.ok) throw new Error("API Network error");

            const data = await response.json();
            // Append bot response from API
            appendMessage(data.response, "bot-msg");
        } catch (error) {
            appendMessage("Error communicating with server.", "bot-msg");
            console.error(error);
        }
    }

    async function loadHistory() {
        try {
            // REST GET Call to fetch conversation history
            const response = await fetch(`/api/v1/history/${userId}`);
            const data = await response.json();

            const container = document.getElementById("chatContainer");
            container.innerHTML = ""; // Clear view

            data.history.forEach(item => {
                const className = item.role === "user" ? "user-msg" : "bot-msg";
                appendMessage(item.text, className);
            });
        } catch (error) {
            console.error("Failed to load history:", error);
        }
    }

    function appendMessage(text, className) {
        const container = document.getElementById("chatContainer");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${className}`;
        msgDiv.textContent = text;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }
</script>

</body>
</html>
